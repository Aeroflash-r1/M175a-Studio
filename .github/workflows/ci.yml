name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build app + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests (protocol + layout math)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M175-OTG-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  bridge:
    name: Windows bridge sanity (compileall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile all bridge modules
        run: python -m compileall windows-bridge/m175_bridge windows-bridge/tools
